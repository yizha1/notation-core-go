name: Reusable license checker

on:
  workflow_call:

jobs:
  check-license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Check license header
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0

        with:
          mode: check
          config: .github/licenserc.yml
      - name: Set up Go for dependency license checking
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
      - name: Check dependencies license
        # The header action installs the pinned license-eye binary.
        run: license-eye -v info -c .github/licenserc.yml dependency check --weak-compatible=true