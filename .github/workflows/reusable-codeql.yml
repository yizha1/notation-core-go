name: Reusable CodeQL

on:
  workflow_call:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        go-version: ["1.26", "stable"]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Go ${{ matrix.go-version }} environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v4.31.0
        with:
          languages: go
          build-mode: autobuild
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v4.31.0
        with:
          upload: ${{ github.repository_owner == 'notaryproject' && 'always' || 'never' }}
          upload-database: ${{ github.repository_owner == 'notaryproject' }}
      - name: Preserve fork CodeQL results
        if: github.repository_owner != 'notaryproject'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-go-${{ matrix.go-version }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
